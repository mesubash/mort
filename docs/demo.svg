<text class="l0" x="24" y="78" fill="#e6edf3" xml:space="preserve">$ mort run --name train --stall 30 --watch &#x27;loss=([0-9.]+)&#x27; -- python train.py</text><text class="l1" x="24" y="100" fill="#8b949e" xml:space="preserve">started train (pid 4242), log ~/.mort/logs/train.log</text><text class="l2" x="24" y="136" fill="#e6edf3" xml:space="preserve">$ mort</text><text class="l3" x="24" y="158" fill="#e6edf3" xml:space="preserve">JOBS</text><text class="l4" x="24" y="180" fill="#3fb950" xml:space="preserve"> *</text><text class="l5" x="24" y="180" fill="#e6edf3" xml:space="preserve">    train   running   1h02m, epoch 14/40 loss=0.48, ~1h55m left</text><text class="l6" x="24" y="202" fill="#f85149" xml:space="preserve"> x</text><text class="l7" x="24" y="202" fill="#e6edf3" xml:space="preserve">    prep    died      02:14 (exit 1)</text><text class="l8" x="24" y="224" fill="#3fb950" xml:space="preserve">ok</text><text class="l9" x="24" y="224" fill="#e6edf3" xml:space="preserve">    eval    finished  14:05 (exit 0)</text><text class="l10" x="24" y="246" fill="#e6edf3" xml:space="preserve">MACHINE</text><text class="l11" x="24" y="268" fill="#e6edf3" xml:space="preserve">   swap 0.9 GB used   disk 38.2 GB free</text><text class="l12" x="24" y="304" fill="#8b949e" xml:space="preserve"># later, while you are away:</text>
